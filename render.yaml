services:
  # ─── Unified Full-Stack Web Service (Frontend + Backend in One) ─────────────
  - type: web
    name: kronos-workspace
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm run build:all
    startCommand: npm run start:all
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20.18.1"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kronos-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SAME_SITE
        value: lax
      - key: EMAIL_PROVIDER
        value: console
      - key: NODE_OPTIONS
        value: "--max-old-space-size=460"
      - key: NEXT_CPU_COUNT
        value: "1"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"

databases:
  # ─── Managed PostgreSQL Database ────────────────────────────────────────────
  - name: kronos-db
    plan: free
    region: virginia
    databaseName: workspace_saas
    user: postgres
